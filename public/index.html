<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8" http-equiv="Content-Type" content="text/html; charset=iso-8859-1">

		<title>Karmatron</title>

		<link rel="stylesheet" href="/style.css">
		<link href='https://fonts.googleapis.com/css?family=MedievalSharp' rel='stylesheet'>
		<link href='https://fonts.googleapis.com/css?family=Press Start 2P' rel='stylesheet'>
		<link href='https://fonts.googleapis.com/css?family=Aclonica' rel='stylesheet'>

		<script src="https://code.jquery.com/jquery-1.12.0.min.js"></script>
		<script src="app.js"></script>
	</head>

	<body>
		<title>Karmatron</title>
		<div class="wrapper" class="non-semantic-protector" style="width: 1200px;">
			<div class = "table">
				<div class = "column" style="width: 280px;margin-left:2%;">

					<h1 class="ribbon-highlight" style="margin-top:15px; margin-left:30px; padding-left:60px;position:absolute;top:10px; text-align: center;">Karmatr0n</h1>
					<div class="subtitle" style="padding: 4px;margin-top:-6px;border-radius: 30px 30px 40px 40px;position:absolute;top:70px;left:60px;width: 240px;">
						<h3>Une histoire avec <span id="kName"></span> !
						</h3>
					</div>
					
					<div class = "hero">
						<h1 class="box"  id="dynamicBackground" style="width: 90%;border: 6px groove;border-color: goldenrod;font-size: 24;">
							Époque <span id="era"></span>
						</h1>
						<div class = "box" style="width: 220px;background-color:rgba(0, 0, 0, 0.265);">
							<img id="kingImage" class="king-image" src="">
						</div>
						<div class = "box" id="dynamicBackground2" style="color: bisque;">
							<h1 style="font-size: 28px;margin-bottom: 6px;margin-top: 4px;">
								<span id="kName2"></span>
								<BR>
								<span id="kTitle" style="font-size: 18px;"></span>
							</h1>
							<h3 style="font-size: 18px;margin-top: 0;">
								Âge : <span id="lvl" style="text-align: start;"></span> ans
							</h3>
							<h1 style="font-size: 16px;margin-bottom: 4px;margin-top: 0;">
								Domaine : <span id="kFief"></span>
								
							</h1>
						</div>
					</div>
				</div>

				<div class = "column" style="width: 100%;">

					<div class="subtitle" style="border-radius: 120px 120px 120px 120px;padding: 8px;width:850px;justify-items: center;align-items: center;">
						<div class = "box" style="width:fit-content;margin-top:6px;margin-bottom:20px; border:0px; background-image:linear-gradient(to bottom, rgba(193, 203, 150, 0.693), black); display: flex;">							
							
							<button id="skipButton" class="smallButton">⏭️</button>
							<button id="pauseResumeButton" class="smallButton">⏸️</button>
							<button id="music" class="smallButton">🎶</button>
							<button id="muteButton" class="smallButton" style="color: crimson;background-image:linear-gradient(to right, rgb(0, 0, 0),rgba(39, 0, 0, 0.925))">🔇</button>
							<button id="reset"  class="smallButton" style="color: crimson;background-image:linear-gradient(to right, rgb(0, 0, 0),rgba(39, 0, 0, 0.925))">RESET</button>
						</div>

						<div class = "story" id="EpisodeDisplay" style="width: 750px;height: 350px;  overflow-y: auto;overflow-x: hidden;position: relative;scroll-behavior: smooth; box-sizing: border-box;">
								<span id="CurrentEpisode" style ="text-indent: 30px; line-height:1.4;"></span>
						</div>

						<div class="slider-wrapper" style="height: 140px;">

							<div class="buttonContainer">
								<div class="slider" id="actionContainer">									
								</div>
							</div>

						</div>

						<div class = "box" style = "margin-top:6px;margin-bottom:6px; background-image:linear-gradient(to bottom, rgba(67, 73, 41, 0.781), black); display: flex;justify-items: center;align-items: center; border: 4px black ridge; border-radius:60px 60px 60px 60px;width:600px;">
							<button id="nextEpisode" style="background-image:linear-gradient(to bottom, rgba(9, 61, 22, 0.925),rgba(5, 112, 1, 0.897)); font-size: 20px;margin-right:15px;">Commencer</button>
							
							<h1 class="box" id="dynamicBackground3" style="font-size : 40px;border-width: 6px; border-radius: 10 10 10 10; border-color:goldenrod; border-style: ridge; text-align: center; width:20%;height:50%;">
								<div id="dynamicText" style="text-align: center;width: fit-content;font-size: xx-large;margin:0">
									<span id="score"></span> pts
								</div>								
							</h1>
							
							<div class = "box" style="padding:4px;margin:0px;margin-left:15px; border:4px black ridge; background-image:linear-gradient(to bottom, rgba(43, 46, 28, 0), black)">
								<h1 style = "font-size: 24px;text-align: start;justify-content: center;align-items: center;line-height: 1.6;">
									<span id="HP"></span>
									<BR><span id="Gold"></span>
									<BR><span id="Peons"></span>
								</h1>
							</div>	
						</div>
					</div>

					<div class="subtitle" style="margin:2px;margin-top: 8px;border-radius: 60px 60px 150px 150px;font-size: medium;height:160px; width:90%;justify-items: center;align-items: center; ">
						<div class="ribbon" style="margin-bottom: 0;width: 80%;">
							<H1 style="margin-bottom: 0px">Geste</H1>
						</div>
						<div id="text-container" style="display: flex;justify-content: center;margin-top:2px;">
							<p class="story" id="content" style="height:fit-content;font-size: smaller;margin:0;margin-left: 8px;border-width: 1px; border-radius: 5px 5px 5px 5px;text-indent:30px;width:600px">
								<span id = "saga" class="read-aloud"></span>
							</p>
						</div>
						<div class = "box" style="width:fit-content;margin-top:6px;margin-bottom:4px; border:0px; background-image:linear-gradient(to bottom, rgba(193, 203, 150, 0.693), black); display: flex;">
							<button id="saveButton"  class="smallButton">Parchos</button>
							<button id="read-btn" class="smallButton">Lire saga</button>
						</div>
					</div>
				</div>
			</div>
		</div>	
	</body>
</html>
